study:
  id: synthetic_pose_zero_shot_v1
  status: pilot_scored
  protocol: frozen six-model inference; no fine-tuning
  models:
    - mediapipe_pose_heavy
    - movenet_thunder
    - rtmpose_m
    - yolo11x_pose
    - sapiens_1b_coco
    - openpose_coco18
  initial_target_images_per_dataset: 500
  expansion_target_images_per_dataset: 1000
  annotation_schema: coco17_slots_with_source_provenance
  evaluation: cocodataset_cocoapi_COCOeval_keypoints
  active_synthetic_pilot: nameframe_quarry_crowd_singleperson_pilot300
  pending_dataset_access_and_annotation_audit: true

datasets:
  simuletic_cctv_fall_singleperson_pilot111:
