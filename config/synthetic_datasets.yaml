    reported_scale: "111 free-sample images; 111 selected people from 121 source annotations"
    license: CC-BY-4.0 declared by the dataset card
    annotation_status: exact_coco17_yolo_xyv_to_pixel_coco; largest_bbox_per_image
    cohort_status: pilot_scored_2026-10-26; fall_dominated; excluded_from_general_human_primary_cohort
