benchmark_id: InfantPose-Bench-v4
datasets:
  coco_singleperson_val2017:
    display_name: COCO SinglePerson val2017
    domain: adult
    expected_samples: 921
    annotation_contract: coco17
    metric: oks_pck10_coverage
  syrip_test100:
    display_name: SyRIP Test100
    domain: infant
    expected_samples: 100
    annotation_contract: coco17_verified_mapping
    metric: oks_pck10_coverage
  coco_unihuman_child_val134:
    display_name: COCO-UniHuman apparent-age child subset (val134)
    domain: child_real_rgb_apparent_age
    expected_samples: 134
    annotation_contract: coco17_identity_mapping_person_crops
    metric: cocoapi_keypoint_oks
    source: https://github.com/lishuhuai527/COCO-UniHuman
    source_split: COCO-UniHuman v2 val / COCO val2017
    apparent_age_years: [3, 17]
    license: research-only; COCO-UniHuman annotations CC BY 4.0; images remain subject to source image terms
    note: Excludes COCO evaluation IDs and byte-identical source images; one child crop per unique source image hash.
  simuletic_cctv_fall_pilot111:
    display_name: Simuletic Synthetic CCTV Fall Pilot (111 images)
    domain: synthetic_cctv_fall_pose_pilot
    expected_samples: 111
    annotation_contract: coco17_exact_source_yolo_to_pixels
    metric: cocoapi_keypoint_oks
    source: https://huggingface.co/datasets/Simuletic/CCTV_Incident_Dataset_Fall_Lying_Down_Detection
    license: CC BY 4.0
    role: exploratory workflow pilot only; 111 fall-dominated images are not the main general-human synthetic benchmark
  simuletic_cctv_fall_singleperson_pilot111:
    display_name: Simuletic Synthetic CCTV Single-Person Pilot (111 images)
    domain: synthetic_cctv_fall_pose_pilot
    expected_samples: 111
    annotation_contract: coco17_exact_source_yolo_largest_person_per_image
    metric: cocoapi_keypoint_oks
    source: https://huggingface.co/datasets/Simuletic/CCTV_Incident_Dataset_Fall_Lying_Down_Detection
    license: CC BY 4.0
    role: exploratory workflow pilot only; not the primary general-human synthetic benchmark
  nameframe_quarry_crowd_singleperson_pilot300:
    display_name: NameFrame Quarry Crowd Synthetic Single-Person Pilot (300 images)
    domain: synthetic_unreal_quarry_crowd
    expected_samples: 300
    annotation_contract: coco17_slots_12_body_points_face_unlabeled
    metric: cocoapi_keypoint_oks
    source: https://getnameframe.com/datasets/quarry-crowd
    license: free benchmark use under NameFrame sample terms; no dataset repackaging; check third-party Unreal asset terms before redistribution
    role: exploratory synthetic-domain pilot; five face landmarks unavailable; see dataset manifest for source audit limitations
  spinetrack_unreal_singleperson_pilot1000:
    display_name: SpineTrack-Unreal Synthetic Single-Person Pilot (1,000 images)
    domain: synthetic_unreal_biomechanical_pose
    expected_samples: 1000
    annotation_contract: exact_coco17_subset_of_official_37_keypoint_order_with_out_of_frame_visible_points_filtered
    metric: cocoapi_keypoint_oks
    source: https://huggingface.co/datasets/saifkhichi96/spinetrack
    license: CC BY-NC 4.0; attribution required; non-commercial use only
    role: primary full-COCO-17 synthetic pilot; 1,000 images scored by all six models; single synthetic person per image; source has 25,000 Unreal Engine frames and 37 named points
